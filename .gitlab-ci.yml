stages:
  - build
  - release

build:
  stage: build
  tags:
    - shell

  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY

  script:
    - echo BUILD_JOB_ID="${CI_JOB_ID}" > $CI_PROJECT_DIR/variables.env
    - docker pull $CI_REGISTRY/ayratproject/stm_builder:main
    - |
      docker build -f Dockerfile \
          -t $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_NAME \
          --build-arg BUILD_VERSION="$CI_COMMIT_TAG" \
          --build-arg BUILD_DATE="$(date +%Y%m%d_%H%M%S)" \
          --pull . \
          -o .

  artifacts:
    paths:
      - firmware.bin
      - firmware.elf
    reports:
      dotenv: variables.env

  variables:
    GIT_SUBMODULE_STRATEGY: recursive

release:
  stage: release
  tags:
    - shell
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_REF_NAME =~ /^v\d+\.\d+\.\d+$/
  needs: 
    - job: "build"
      artifacts: true
  release:
    name: 'Release $CI_COMMIT_REF_NAME-$CI_COMMIT_SHORT_SHA'
    tag_name: '$CI_COMMIT_REF_NAME'
    description: CHANGELOG.md
    ref: '$CI_COMMIT_SHA'
    assets:
      links:
        - name: 'Binaries_$CI_COMMIT_TAG'
          url: '$CI_PROJECT_URL/-/jobs/$BUILD_JOB_ID/artifacts/download?file_type=archive'
  script:
    - echo "creating release"